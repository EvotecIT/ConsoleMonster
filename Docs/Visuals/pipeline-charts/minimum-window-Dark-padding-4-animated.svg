<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="76" height="54.8" viewBox="0 0 76 54.8" role="img" aria-label="Minimum window">
<title>Minimum window</title>
<style>
svg{--cm-fg:#cccccc;--cm-bg:#0c0c0c;--cm-chrome:#1f1f1f;--cm-chrome-fg:#a0a0a0}
.cm-t{font-family:'Cascadia Mono', 'Cascadia Code', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:14px;text-anchor:middle;dominant-baseline:central;font-variant-ligatures:none}
.cm-s{shape-rendering:crispEdges}
.cm-title{font:13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--cm-chrome-fg);text-anchor:middle;dominant-baseline:central}
@keyframes cm-play{0%{transform:translateX(0px)}9.091%{transform:translateX(-76px)}100%{transform:translateX(-76px)}}
.cm-strip{animation:cm-play 2.2s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){.cm-strip{animation-play-state:paused}}
</style>
<defs>
<g id="r0"><text class="cm-t" x="4.2" y="8.4" fill="#cccccc">x</text></g>
<g id="r1"><text class="cm-t" x="4.2" y="8.4" fill="#cccccc">y</text></g>
</defs>
<rect width="76" height="54.8" rx="10" style="fill:var(--cm-chrome)"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/><circle cx="38" cy="15" r="6" fill="#febc2e"/><circle cx="58" cy="15" r="6" fill="#28c840"/>

<svg x="0" y="30" width="76" height="24.8"><rect width="100%" height="100%" fill="#0c0c0c"/>
<g class="cm-strip">
<g transform="translate(0 0)"><use href="#r0" xlink:href="#r0" y="4" x="4"/></g>
<g transform="translate(76 0)"><use href="#r1" xlink:href="#r1" y="4" x="4"/></g>
</g></svg>
</svg>
