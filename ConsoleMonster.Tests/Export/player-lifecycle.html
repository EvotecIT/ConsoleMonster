<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Player lifecycle regression checks</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto}li{padding:6px}.pass{color:green}.fail{color:#b00}</style>
<link rel="stylesheet" href="../../ConsoleMonster/Export/Assets/player.css">
<link rel="stylesheet" href="../../Website/themes/consolemonster/assets/pages.css">
<h1>Player lifecycle regression checks</h1><ul id="results"></ul><div id="fixture"></div>
<script src="../../ConsoleMonster/Export/Assets/player.js"></script>
<script>
(async function () {
  const api = window.ConsoleMonsterPlayer;
  const fixture = document.getElementById('fixture');
  const results = document.getElementById('results');
  const data = {format:'consolemonster-player',version:1,width:8,height:1,fps:10,duration:1000,chrome:false,rows:['first','second'],frames:[[0,[0]],[500,[1]]]};
  function assert(ok, name) {
    const result=document.createElement('li'); result.className=ok?'pass':'fail'; result.textContent=(ok?'PASS: ':'FAIL: ')+name; results.appendChild(result);
    if (!ok) throw new Error(name);
  }
  try {
    const host=document.createElement('div'); fixture.appendChild(host);
    const old=api.mount(host,data); old.setVisible(true); old.destroy();
    const current=api.mount(host,data); current.setVisible(true);
    host.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));
    assert(api.players.length===1 && host.querySelectorAll('.cm-controls').length===1 && host.querySelector('.cm-play').getAttribute('aria-label')==='Pause','destroy/remount keeps one player and one keyboard handler');
    current.pause(); old.play();
    assert(host.querySelector('.cm-play').getAttribute('aria-label')==='Play','a destroyed instance cannot restart');
    current.destroy();
    const source=document.createElement('script'); source.type='application/json'; source.id='recording'; source.textContent=JSON.stringify(data); fixture.appendChild(source);
    host.setAttribute('data-cm-recording','#recording');
    api.scan(fixture); const scanned=host.__cmPlayer; scanned.destroy(); api.scan(fixture);
    assert(host.__cmPlayer && host.__cmPlayer!==scanned && !host.__cmLoading && api.players.length===1,'scan/destroy/scan remounts successfully');
    host.__cmPlayer.destroy();
    const originalFetch=window.fetch; let release;
    window.fetch=()=>new Promise(resolve=>{release=resolve;});
    host.setAttribute('data-cm-recording','pending.json'); api.scan(fixture);
    const manual=api.mount(host,data); manual.destroy();
    host.setAttribute('data-cm-recording','#recording'); api.scan(fixture); const replacement=host.__cmPlayer;
    release({ok:true,json:()=>Promise.resolve(data)});
    await new Promise(resolve=>setTimeout(resolve,30)); window.fetch=originalFetch;
    assert(host.__cmPlayer===replacement && api.players.length===1 && !host.__cmLoading,'an obsolete pending fetch cannot replace a new player');
    replacement.destroy();
    assert(api.players.length===0 && host.querySelectorAll('.cm-controls').length===0,'teardown releases the registry and generated controls');
    // Drive the real player with a deterministic browser clock: at 4x a sparse recording must show its middle frame
    // at 650 ms and finish at 1950 ms, rather than skipping content behind the normal-speed timer floor.
    const realTimeout=window.setTimeout, realClearTimeout=window.clearTimeout, realNow=performance.now;
    let clock=0, timerId=0; const timers=new Map();
    window.setTimeout=(callback,delay)=>{const id=++timerId;timers.set(id,{callback,due:clock+delay});return id;};
    window.clearTimeout=id=>timers.delete(id);
    performance.now=()=>clock;
    function tick(until) {
      for(let count=0;count<100;count++) {
        const next=[...timers.entries()].sort((a,b)=>a[1].due-b[1].due)[0];
        if(!next || next[1].due>until) break;
        clock=next[1].due;timers.delete(next[0]);next[1].callback();
      }
      clock=until;
    }
    let fast, autoplay, deepLink;
    try {
      fast=api.mount(host,{...data,fps:0.385,duration:7800,rows:['first','middle','last'],frames:[[0,[0]],[2600,[1]],[7800,[2]]]});
      fast.setVisible(true);
      const rate=host.querySelector('.cm-speed');rate.value='4';rate.dispatchEvent(new Event('change'));fast.play();
      tick(800);
      assert(host.querySelector('.cm-screen').textContent==='middle','4x playback displays the intermediate sparse frame on time');
      tick(2000);
      assert(host.querySelector('.cm-screen').textContent==='last' && host.querySelector('.cm-play').getAttribute('aria-label')==='Play','4x playback reaches the final frame and stops at the scaled duration');
      fast.destroy();
      host.setAttribute('data-cm-autoplay','');
      autoplay=api.mount(host,data,{start:data.duration});autoplay.setVisible(true);
      assert(autoplay.state().playing && autoplay.state().time===0 && host.querySelector('.cm-screen').textContent==='first','autoplay from the final poster rewinds and starts with the first frame');
      tick(2600);
      assert(autoplay.state().playing && autoplay.state().time>0 && host.querySelector('.cm-screen').textContent==='second','rewound autoplay progresses through the recording');
      tick(3100);
      autoplay.setVisible(false);autoplay.setVisible(true);
      assert(!autoplay.state().playing && !autoplay.state().wanted && autoplay.state().time===data.duration && host.querySelector('.cm-screen').textContent==='second','completed autoplay holds the result after a visibility cycle');
      autoplay.destroy();
      host.setAttribute('data-cm-start',String(data.duration));
      deepLink=api.mount(host,data);deepLink.setVisible(true);
      assert(!deepLink.state().playing && deepLink.state().time===data.duration,'an explicit end-position deep link still suppresses autoplay');
      deepLink.play();
      assert(deepLink.state().playing && deepLink.state().time===0 && host.querySelector('.cm-screen').textContent==='first','Play from an end-position deep link rewinds');
    } finally {
      if(fast) fast.destroy();
      if(autoplay) autoplay.destroy();
      if(deepLink) deepLink.destroy();
      host.removeAttribute('data-cm-autoplay');host.removeAttribute('data-cm-start');
      window.setTimeout=realTimeout;window.clearTimeout=realClearTimeout;performance.now=realNow;
    }
    const chapters=api.mount(host,{...data,duration:20000,markers:[[1000,'Inspect'],[8000,'Build'],[15000,'Report']]});
    const choose=host.querySelector('.cm-chapters');
    choose.value='8000';choose.dispatchEvent(new Event('change'));
    assert(chapters.state().time===8000,'chapter select seeks to the named chapter');
    host.dispatchEvent(new KeyboardEvent('keydown',{key:'3',bubbles:true}));
    assert(chapters.state().time===15000,'number keys seek to the corresponding chapter');
    host.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
    assert(chapters.state().time===10000,'arrow keys move five seconds');
    const marks=host.querySelectorAll('.cm-mark');marks[0].click();
    assert(chapters.state().time===1000 && marks[0].getAttribute('data-tooltip')==='Inspect' && marks[0].getAttribute('aria-label')==='Go to Inspect','track ticks seek and expose accessible chapter names');
    const help=host.querySelector('.cm-help');
    const helpSpace=new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true});
    help.querySelector('summary').dispatchEvent(helpSpace);
    assert(!helpSpace.defaultPrevented && !chapters.state().wanted,'help retains native Space activation without toggling playback');
    help.open=true;
    host.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    assert(!help.open && help.textContent.includes('Jump to chapter'),'keyboard help names chapter shortcuts and closes with Escape');
    const clipboard=Object.getOwnPropertyDescriptor(navigator,'clipboard');
    Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:()=>Promise.resolve()}});
    try {
      host.querySelector('.cm-copy').click();await Promise.resolve();
      assert(host.querySelector('.cm-copy').getAttribute('aria-label')==='Copied','copy confirms successful clipboard write');
      await new Promise(resolve=>setTimeout(resolve,1700));
      assert(host.querySelector('.cm-copy').getAttribute('aria-label')==='Copy' && !host.querySelector('.cm-copy').classList.contains('cm-feedback'),'copy confirmation resets to Copy');
    } finally {
      if(clipboard) Object.defineProperty(navigator,'clipboard',clipboard);else delete navigator.clipboard;
      chapters.destroy();
    }
    host.classList.add('cm-replay');host.style.width='350px';
    const embedded=api.mount(host,{...data,duration:20000,markers:[[1000,'Inspect'],[19000,'Report']]});
    try {
      const track=host.querySelector('.cm-track').getBoundingClientRect();
      const ticks=[...host.querySelectorAll('.cm-mark')];
      assert(ticks.every(mark=>{const rect=mark.getBoundingClientRect();return getComputedStyle(mark).position==='absolute' && Math.abs(rect.top+rect.height/2-track.top-track.height/2)<1;}) && getComputedStyle(host.querySelector('.cm-marks')).marginTop==='0px','chapter ticks stay on the scrubber when embedded in legacy replay styles');
    } finally { embedded.destroy();host.classList.remove('cm-replay');host.style.removeProperty('width'); }
    document.title='PASS: Player lifecycle regression checks';
  } catch(error) { document.title='FAIL: Player lifecycle regression checks'; console.error(error); }
})();
</script></html>
