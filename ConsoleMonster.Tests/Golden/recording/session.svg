<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="175" height="102" viewBox="0 0 175 102" role="img" aria-label="Recorded session">
<title>Recorded session</title>
<style>
svg{--cm-fg:#cccccc;--cm-bg:#0c0c0c;--cm-chrome:#1f1f1f;--cm-chrome-fg:#a0a0a0}
svg{--cm-chrome:#1f2a3c;--cm-chrome-fg:#8b8f9a;--cm-chrome-title:#8b8f9a;--cm-tab:#0c0c0c;--cm-border:#4b5060;--cm-accent:#60a5fa;--cm-desk:#3a3a3f;--cm-close:#ce534c;--cm-minimise:#c59a2a;--cm-zoom:#26a443}
.cm-t{font-family:'Cascadia Mono', 'Cascadia Code', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:14px;text-anchor:middle;dominant-baseline:alphabetic;font-variant-ligatures:none}
.cm-s{shape-rendering:crispEdges}
.cm-title{font-family:'Cascadia Mono', 'Cascadia Code', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:13px;font-weight:400;fill:var(--cm-chrome-title);text-anchor:middle;dominant-baseline:alphabetic}
@keyframes cm-play{0%{transform:translateX(0px)}25%{transform:translateX(-175px)}50%{transform:translateX(-350px)}100%{transform:translateX(-350px)}}
.cm-strip{animation:cm-play 2s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){.cm-strip{animation-play-state:paused}}
</style>
<defs>
<g id="r0"><text class="cm-t" x="4.2 12.6 21 29.4 37.8" y="14" fill="#13a10e">Build</text></g>
<g id="r1"><text class="cm-t" x="4.2 12.6 21 29.4 37.8 46.2 54.6 71.4 79.8 88.2" y="14" fill="#cccccc">Working50%</text></g>
<g id="r2"><text class="cm-t" x="4.2 12.6 21 29.4" y="14" fill="#cccccc">Done</text></g>
</defs>
<rect x="0" y="0" width="175" height="102" rx="0" fill="var(--cm-desk)"/><defs><filter id="cm-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/></filter></defs><g filter="url(#cm-shadow)"><rect x="8" y="8" width="159" height="86" rx="10" fill="var(--cm-bg)"/></g><rect x="8" y="8" width="159" height="86" rx="10" fill="var(--cm-bg)" stroke="var(--cm-border)" stroke-width="1.2"/><defs><clipPath id="cm-inner-clip"><rect x="9" y="9" width="157" height="84" rx="9" fill="#ffffff"/></clipPath><clipPath id="cm-bar-clip"><rect x="8" y="8" width="159" height="86" rx="10" fill="#ffffff"/></clipPath></defs><g clip-path="url(#cm-bar-clip)"><rect x="8" y="8" width="159" height="28" rx="0" fill="var(--cm-chrome)"/></g><path d="M8 36H167" fill="none" stroke="var(--cm-border)" stroke-width="1"/><circle cx="26" cy="22" r="6" style="fill:var(--cm-close)"/><circle cx="46" cy="22" r="6" style="fill:var(--cm-minimise)"/><circle cx="66" cy="22" r="6" style="fill:var(--cm-zoom)"/><g clip-path="url(#cm-inner-clip)"><svg x="8" y="36" width="159" height="58"><rect width="100%" height="100%" fill="#0c0c0c"/>
<g class="cm-strip">
<g transform="translate(0 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/></g>
<g transform="translate(175 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/><use href="#r1" xlink:href="#r1" y="28.8" x="12"/></g>
<g transform="translate(350 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/><use href="#r2" xlink:href="#r2" y="28.8" x="12"/></g>
</g></svg></g>
</svg>
