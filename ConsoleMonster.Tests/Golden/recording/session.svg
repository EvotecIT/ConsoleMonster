<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="158.4" height="121.2" viewBox="0 0 158.4 121.2" role="img" aria-label="Recorded session">
<title>Recorded session</title>
<style>
svg{--cm-fg:#cccccc;--cm-bg:#0c0c0c;--cm-chrome:#1f1f1f;--cm-chrome-fg:#a0a0a0}
.cm-t{font-family:'Cascadia Mono', 'Cascadia Code', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:14px;text-anchor:middle;dominant-baseline:central;font-variant-ligatures:none}
.cm-s{shape-rendering:crispEdges}
.cm-title{font:13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--cm-chrome-fg);text-anchor:middle;dominant-baseline:central}
@keyframes cm-play{0%{transform:translateX(0px)}10%{transform:translateX(-158.4px)}25%{transform:translateX(-316.8px)}50%{transform:translateX(-475.2px)}100%{transform:translateX(-475.2px)}}
.cm-strip{animation:cm-play 2s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){.cm-strip{animation-play-state:paused}}
</style>
<defs>
<g id="r0"><text class="cm-t" x="4.2 12.6 21 29.4 37.8" y="8.4" fill="#13a10e">Build</text></g>
<g id="r1"><text class="cm-t" x="4.2 12.6 21 29.4 37.8 46.2 54.6 71.4 79.8 88.2" y="8.4" fill="#cccccc">Working50%</text></g>
<g id="r2"><text class="cm-t" x="4.2 12.6 21 29.4" y="8.4" fill="#cccccc">Done</text></g>
</defs>
<rect width="158.4" height="121.2" rx="10" style="fill:var(--cm-chrome)"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/><circle cx="38" cy="15" r="6" fill="#febc2e"/><circle cx="58" cy="15" r="6" fill="#28c840"/>
<svg class="cm-title-area" x="76" y="0" width="70.4" height="30" overflow="hidden"><text class="cm-title" x="35.2" y="15" textLength="64" lengthAdjust="spacingAndGlyphs" style="font-family:monospace"><title>Recorded session</title>Recorde…</text></svg>
<svg x="0" y="30" width="158.4" height="91.2"><rect width="100%" height="100%" fill="#0c0c0c"/>
<g class="cm-strip">
<g transform="translate(0 0)"></g>
<g transform="translate(158.4 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/></g>
<g transform="translate(316.8 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/><use href="#r1" xlink:href="#r1" y="28.8" x="12"/></g>
<g transform="translate(475.2 0)"><use href="#r0" xlink:href="#r0" y="12" x="12"/><use href="#r2" xlink:href="#r2" y="28.8" x="12"/></g>
</g></svg>
</svg>
