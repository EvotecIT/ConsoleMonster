version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - '/**/*'
    # The source generator must load in the compiler shipped by supported SDKs.
    ignore:
      - dependency-name: Microsoft.CodeAnalysis.CSharp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      include: ['*']
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ['*']
