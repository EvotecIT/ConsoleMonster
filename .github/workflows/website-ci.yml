name: Website CI

on:
  pull_request:
    paths:
      - "Website/**"
      - "ConsoleMonster/**"
      - "ConsoleMonster.Examples/**"
      - "ConsoleMonster.Generators/**"
      - "Module/en-US/**"
      - "Directory.Build.props"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/website-deploy.yml"
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "ConsoleMonster/**"
      - "ConsoleMonster.Examples/**"
      - "ConsoleMonster.Generators/**"
      - "Module/en-US/**"
      - "Directory.Build.props"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@643e034ed1f9a161bb9e6dd80fd5204a8269c50b
    with:
      website_root: Website
      dotnet_version: |
        8.0.x
        10.0.x
      pipeline_config: Website/pipeline.json
      powerforge_lock_path: ./Website/.powerforge/engine-lock.json
      powerforge_repository_override: ${{ vars.POWERFORGE_REPOSITORY }}
      powerforge_ref_override: ${{ vars.POWERFORGE_REF }}
