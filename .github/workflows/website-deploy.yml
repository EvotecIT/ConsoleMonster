name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - 'Website/**'
      - 'ConsoleMonster/**'
      - 'ConsoleMonster.Examples/**'
      - 'ConsoleMonster.Generators/**'
      - 'Module/en-US/**'
      - 'Directory.Build.props'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  deployments: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: website-deploy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@df478a7a984f80c18c4ec51f16f8c00e9a61408d
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      site_output_path: Website/_site
      powerforge_lock_path: ./Website/.powerforge/engine-lock.json
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: df478a7a984f80c18c4ec51f16f8c00e9a61408d
