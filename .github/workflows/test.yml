# PRs test Windows and Linux; default-branch pushes and manual runs retain the full matrix.
name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Unique non-PR groups also prevent queued default-branch runs replacing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: |
    8.x
    10.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEST_VERBOSITY: minimal
  # Use the same exact Pester package on every supported host.
  PESTER_VERSION: '6.1.0'
  # Hosted runners are throwaway, so the trash tests may use the real recycle bin and Trash there; local runs skip them.
  CONSOLEMONSTER_TEST_REAL_TRASH: '1'

jobs:
  changes:
    name: Select test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect build and test inputs
        id: paths
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess

          def docs_only(path):
              # These Markdown, generated docs, schemas, examples and assets are real test/build inputs.
              if path == 'README.md' or path.startswith(('ConsoleMonster', 'Module/', 'Tests/', 'Templates/', 'Docs/')):
                  return False
              if any(part.lower() in ('schema', 'schemas') for part in path.split('/')):
                  return False
              if path.startswith('Website/'):
                  if path == 'Website/static/site/icon-192.png':
                      return False
                  # Website content, examples, data and tools are exercised by Pester and the module build.
                  return path.startswith(('Website/themes/', 'Website/static/site/', 'Website/static/readme/'))
              return path.endswith('.md')

          build = True
          if os.environ['EVENT_NAME'] == 'pull_request':
              # Complete PR diff, including both sides of renames, deletions and earlier commits.
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE_SHA'] + '...' + os.environ['HEAD_SHA'],
              ]).decode('utf-8').split('\0')
              paths = [path for path in paths if path]
              build = not paths or not all(docs_only(path) for path in paths)
              for path in paths:
                  print(('test input: ' if not docs_only(path) else 'presentation/docs: ') + path)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('build=' + str(build).lower() + '\n')

  test-result:
    name: Test result
    needs: [changes, dotnet-windows, native-aot, pester, dotnet-linux, dotnet-macos, native-aot-linux, pester-linux, pester-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected test coverage
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          changes = results.pop('changes')
          build = changes.get('outputs', {}).get('build')
          if changes['result'] != 'success' or build not in ('true', 'false'):
              raise SystemExit('Test coverage selection did not succeed.')
          for name, job in results.items():
              skipped = build == 'false' or (
                  os.environ['EVENT_NAME'] == 'pull_request' and name in ('dotnet-macos', 'pester-macos')
              )
              expected = 'skipped' if skipped else 'success'
              if job['result'] != expected:
                  raise SystemExit(name + ': expected ' + expected + ', got ' + job['result'])
          print('Presentation/docs-only PR: heavy jobs skipped.' if build == 'false' else 'All selected tests passed.')

  dotnet-windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'xUnit (Windows, ${{ matrix.framework }})'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net8.0, net10.0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ConsoleMonster.sln

      - name: Build (warnings as errors)
        run: dotnet build ConsoleMonster.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ConsoleMonster.Tests/ConsoleMonster.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx
        timeout-minutes: 15

      - name: Test the logging and hosting packages
        run: dotnet test ConsoleMonster.Extensions.Tests/ConsoleMonster.Extensions.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx
        timeout-minutes: 10

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows-${{ matrix.framework }}
          path: '**/*.trx'

  native-aot:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Native AOT (Windows, ${{ matrix.framework }})'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish native executable (trim and AOT warnings are errors)
        run: dotnet publish Tests/AotSmoke/AotSmoke.csproj -c Release -f ${{ matrix.framework }} -r win-x64 -o Artefacts/AotSmoke
      - name: Run native executable
        run: ./Artefacts/AotSmoke/AotSmoke.exe

  pester:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Pester (${{ matrix.name }})'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Windows PowerShell 5.1'
            shell: powershell
          - name: 'PowerShell 7'
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Parse every module script with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./Module/Tests/Support/Test-ModuleScriptSyntax.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the module binaries (Debug, loaded by Module/ConsoleMonster.psm1 in development mode)
        run: dotnet build ConsoleMonster.PowerShell/ConsoleMonster.PowerShell.csproj --configuration Debug

      - name: Build the console test host (Debug)
        run: dotnet build ConsoleMonster.TestHost/ConsoleMonster.TestHost.csproj --configuration Debug -warnaserror

      - name: Build native editor contracts before the module is loaded
        run: dotnet build Website/tools/SiteFrames.Tests/SiteFrames.Tests.csproj --configuration Debug -warnaserror

      - name: Install Pester
        # Download with the hosted PowerShell 7 client; Run Pester still uses matrix.shell, including 5.1.
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
          Write-Host "PowerShell $($PSVersionTable.PSVersion); PSResourceGet $((Get-Module Microsoft.PowerShell.PSResourceGet).Version)"
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $null = New-Item -ItemType Directory -Path $moduleRoot -Force
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Save-PSResource -Name Pester -Version $env:PESTER_VERSION -Repository PSGallery -Path $moduleRoot -TrustRepository -ErrorAction Stop
              break
            } catch {
              Write-Warning "Pester download attempt $attempt/4 failed: $($_.Exception.Message)"
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * [Math]::Pow(2, $attempt - 1))
            }
          }

      - name: Run Pester
        run: |
          # Preserve this test host's native module paths, especially Windows PowerShell 5.1.
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $env:PSModulePath = $moduleRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          Write-Host "Pester $((Get-Module Pester).Version)"
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'Module/Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $configuration
        timeout-minutes: 35

      - name: Upload Pester results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pester-results-${{ matrix.shell }}
          path: pester-results.xml

  dotnet-linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'xUnit (Ubuntu, ${{ matrix.framework }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      TERM: xterm-256color
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: |
          dotnet restore ConsoleMonster.Tests/ConsoleMonster.Tests.csproj
          dotnet restore ConsoleMonster.Extensions.Tests/ConsoleMonster.Extensions.Tests.csproj
      - name: Build (warnings as errors)
        run: |
          dotnet build ConsoleMonster.Tests/ConsoleMonster.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore -warnaserror
          dotnet build ConsoleMonster.Extensions.Tests/ConsoleMonster.Extensions.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore -warnaserror
      - name: Test
        # These harness-only contracts also exercise Darwin observation/error boundaries without a live Mac claim.
        run: |
          python3 -B -m unittest discover -s ConsoleMonster.Tests/Input/Fixtures -p test_unix_input_pty.py -v
          dotnet test ConsoleMonster.Tests/ConsoleMonster.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx
        timeout-minutes: 15
      - name: Test the logging and hosting packages
        run: dotnet test ConsoleMonster.Extensions.Tests/ConsoleMonster.Extensions.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-linux-${{ matrix.framework }}
          path: '**/*.trx'

  dotnet-macos:
    needs: changes
    name: 'xUnit (macOS, ${{ matrix.framework }})'
    # Full macOS coverage on default-branch pushes and manual runs.
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    # Keep macOS validation on an explicit supported ARM64 image.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    env:
      TERM: xterm-256color
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ConsoleMonster.Tests/ConsoleMonster.Tests.csproj
      - name: Build (warnings as errors)
        run: dotnet build ConsoleMonster.Tests/ConsoleMonster.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore -warnaserror
      - name: Test
        run: |
          python3 -B -m unittest discover -s ConsoleMonster.Tests/Input/Fixtures -p test_unix_input_pty.py -v
          dotnet test ConsoleMonster.Tests/ConsoleMonster.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --blame-hang-timeout 3m --blame-hang-dump-type none
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-macos-${{ matrix.framework }}
          path: |
            **/*.trx
            **/*Sequence.xml

  native-aot-linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Native AOT (Ubuntu, net10.0)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish native executable (trim and AOT warnings are errors)
        run: dotnet publish Tests/AotSmoke/AotSmoke.csproj -c Release -f net10.0 -r linux-x64 -o Artefacts/AotSmoke
      - name: Run native executable (native and linker coverage; it prints no glyphs)
        run: |
          ./Artefacts/AotSmoke/AotSmoke
          LANG=C ./Artefacts/AotSmoke/AotSmoke

  pester-linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Pester and terminal probes (Ubuntu, PowerShell 7)'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      TERM: xterm-256color
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the module binaries (Debug, net8.0 and net10.0)
        run: |
          dotnet build ConsoleMonster.PowerShell/ConsoleMonster.PowerShell.csproj --configuration Debug --framework net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ConsoleMonster.PowerShell/ConsoleMonster.PowerShell.csproj --configuration Debug --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the console test host (Debug, net8.0)
        run: dotnet build ConsoleMonster.TestHost/ConsoleMonster.TestHost.csproj --configuration Debug --framework net8.0 -warnaserror
      - name: Import smoke (exports match the manifest)
        run: |
          $manifest = Import-PowerShellDataFile ./Module/ConsoleMonster.psd1
          Import-Module ./Module/ConsoleMonster.psd1 -Force -ErrorAction Stop
          $exported = @((Get-Module ConsoleMonster).ExportedCmdlets.Keys | Sort-Object)
          $expected = @($manifest.CmdletsToExport | Sort-Object)
          $difference = Compare-Object $expected $exported
          if ($difference) { $difference | Format-Table | Out-String | Write-Host; throw "Exported cmdlets differ from the manifest ($($exported.Count) exported, $($expected.Count) in the manifest)." }
          Write-Host "Exports match the manifest: $($exported.Count) cmdlets"
      - name: Glyph tier follows the locale in a real terminal (C and POSIX ASCII, UTF-8 full)
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            # -like gives the plain decision strings (Select-String would highlight the match with escape codes in a terminal).
            script -qec "env -u COLORTERM -u NO_COLOR -u CI -u GITHUB_ACTIONS -u LC_ALL -u LC_CTYPE TERM=xterm-256color LANG=$1 pwsh -NoProfile -Command \"Import-Module ./Module/ConsoleMonster.psd1; (Get-ConsoleCapability).Decisions -like 'glyphs:*'\"" /dev/null | tr -d '\r'
          }
          for locale in C POSIX; do
            out="$(probe "$locale")"; echo "LANG=$locale -> $out"
            grep -q 'glyphs: Ascii' <<< "$out"
          done
          out="$(probe C.UTF-8)"; echo "LANG=C.UTF-8 -> $out"
          grep -q 'glyphs: Full' <<< "$out"
      - name: Prompt input works without a cursor-position reply
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # 'script' gives pwsh a terminal that never answers ESC[6n; the selection must still read the queued keys.
          # The keys are sent once the prompt is on screen (the typescript is flushed as it is written), not after a fixed wait.
          # The typescript's first line is script's own command header, which contains the title too: it is skipped.
          rm -f select.log
          { for i in $(seq 1 120); do tail -n +2 select.log 2>/dev/null | grep -q 'Pick' && break; sleep 0.5; done; sleep 1; printf '\033[B'; sleep 1; printf '\r'; sleep 2; } | script -qfec "env -u CI -u GITHUB_ACTIONS TERM=xterm-256color pwsh -NoProfile -Command \"Import-Module ./Module/ConsoleMonster.psd1; 'RESULT=' + (Read-ConsoleSelect -Title Pick -Choices a, b, c)\"" select.log > /dev/null || true
          tr -d '\r' < select.log | sed -r 's/\x1b\[[0-9;?]*[ -/]*[@-~]//g' | tail -n 5
          tr -d '\r' < select.log | grep -q 'RESULT=b'
      - name: Install Pester
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
          Write-Host "PowerShell $($PSVersionTable.PSVersion); PSResourceGet $((Get-Module Microsoft.PowerShell.PSResourceGet).Version)"
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $null = New-Item -ItemType Directory -Path $moduleRoot -Force
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Save-PSResource -Name Pester -Version $env:PESTER_VERSION -Repository PSGallery -Path $moduleRoot -TrustRepository -ErrorAction Stop
              break
            } catch {
              Write-Warning "Pester download attempt $attempt/4 failed: $($_.Exception.Message)"
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * [Math]::Pow(2, $attempt - 1))
            }
          }
      - name: Run Pester
        run: |
          # Preserve this test host's native module paths, especially Windows PowerShell 5.1.
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $env:PSModulePath = $moduleRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'Module/Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $configuration
        timeout-minutes: 20
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pester-results-linux
          path: pester-results.xml

  pester-macos:
    needs: changes
    name: 'Pester (macOS, PowerShell 7)'
    # Full macOS coverage on default-branch pushes and manual runs.
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    runs-on: macos-15
    defaults:
      run:
        shell: pwsh
    env:
      TERM: xterm-256color
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the module binaries (Debug, net8.0 and net10.0)
        run: |
          dotnet build ConsoleMonster.PowerShell/ConsoleMonster.PowerShell.csproj --configuration Debug --framework net8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ConsoleMonster.PowerShell/ConsoleMonster.PowerShell.csproj --configuration Debug --framework net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the console test host (Debug, net8.0)
        run: dotnet build ConsoleMonster.TestHost/ConsoleMonster.TestHost.csproj --configuration Debug --framework net8.0 -warnaserror
      - name: Install Pester
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          # Use PowerShell's bundled client instead of legacy NuGet source probing on macOS.
          Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
          Write-Host "PowerShell $($PSVersionTable.PSVersion); PSResourceGet $((Get-Module Microsoft.PowerShell.PSResourceGet).Version)"
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $null = New-Item -ItemType Directory -Path $moduleRoot -Force
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Save-PSResource -Name Pester -Version $env:PESTER_VERSION -Repository PSGallery -Path $moduleRoot -TrustRepository -ErrorAction Stop
              break
            } catch {
              Write-Warning "Pester download attempt $attempt/4 failed: $($_.Exception.Message)"
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * [Math]::Pow(2, $attempt - 1))
            }
          }
      - name: Run Pester
        run: |
          # Preserve this test host's native module paths, especially Windows PowerShell 5.1.
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $env:PSModulePath = $moduleRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = @(Get-ChildItem Module/Tests -Filter *.Tests.ps1 | Where-Object Name -NE 'ConsoleMonster.Examples.Tests.ps1').FullName
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $configuration
        timeout-minutes: 20
      - name: Run Pester examples
        if: ${{ !cancelled() }}
        run: |
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'pester-modules'
          $env:PSModulePath = $moduleRoot + [IO.Path]::PathSeparator + $env:PSModulePath
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'Module/Tests/ConsoleMonster.Examples.Tests.ps1'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'pester-examples-results.xml'
          Invoke-Pester -Configuration $configuration
        timeout-minutes: 20
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pester-results-macos
          path: |
            pester-results.xml
            pester-examples-results.xml
