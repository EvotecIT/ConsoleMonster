  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {{~ ## The content version of what scripts fetch at run time (frame bundles, replays, Prism), from data/assets.json. ## ~}}
  <meta name="cm-runtime" content="{{ data.assets.runtime }}" />
  <title>{{ title_html }}</title>
  {{ description_meta_html }}
  {{ canonical_html }}
  <script>document.documentElement.classList.add('cm-js');(function(){try{var t=localStorage.getItem('cm-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='light';}try{var l=localStorage.getItem('cm-lang');document.documentElement.dataset.lang=(l==='powershell'||l==='csharp'||l==='csharp-fluent')?l:'powershell';}catch(e){document.documentElement.dataset.lang='powershell';}})();</script>
