:root,.cm-export{--cm-fg:#cccccc;--cm-bg:#0c0c0c;--cm-chrome:#2b2b2b;--cm-chrome-fg:#a8a8a8;--cm-desk:#3a3a3f;color-scheme:dark}

body{padding:0}
.cm-export:has(>.cm-window){padding:8px;background:var(--cm-desk);position:relative;isolation:isolate}

.cm-export .cm-window.cm-chrome-macos{display:inline-block;position:relative;min-width:76px;border-radius:10px;overflow:hidden;outline:1.2px solid var(--cm-border);outline-offset:-.6px;background:var(--cm-bg);filter:drop-shadow(0px 12px 18px rgba(0,0,0,.28))}
.cm-export .cm-window.cm-chrome-macos .cm-screen{clip-path:inset(1px round 0 0 9px 9px)}
.cm-export .cm-window.cm-chrome-macos .cm-titlebar{position:relative;container-type:inline-size;min-width:76px;height:28px;background:var(--cm-chrome);color:var(--cm-chrome-fg);box-shadow:inset 0 -1px var(--cm-border)}

.cm-export .cm-window.cm-chrome-macos .cm-right{position:absolute;top:0;right:0}

.cm-export .cm-window.cm-chrome-macos .cm-dots i{display:block;flex:none;width:12px;height:12px;border-radius:50%;background:var(--cm-close)}
.cm-export .cm-window.cm-chrome-macos .cm-dots i+i{background:var(--cm-minimise)}
.cm-export .cm-window.cm-chrome-macos .cm-dots i+i+i{background:var(--cm-zoom)}
.cm-export .cm-screen{display:block;box-sizing:content-box;margin:0;padding:12px;width:36ch;font-family:'Cascadia Mono', 'Cascadia Code', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:14px;line-height:16.8px;color:var(--cm-fg);background:var(--cm-bg);white-space:pre;overflow:hidden;font-variant-ligatures:none;font-kerning:none;-webkit-text-size-adjust:none;text-size-adjust:none;tab-size:1}
.cm-export .cm-screen span,.cm-export .cm-screen a{display:inline-block;vertical-align:top;height:16.8px}
.cm-export .cm-screen a{color:inherit;text-decoration:none}
.cm-export .cm-screen a:hover{text-decoration:underline}
.cm-export .cm-screen .n{width:1ch;text-align:center;overflow:visible}
.cm-export .cm-screen .w{width:2ch;text-align:center;overflow:visible}
.cm-export .cm-screen .b{position:relative}
.cm-export .cm-screen .b svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;shape-rendering:crispEdges}
.cm-export .cm-screen{position:relative}
.cm-export .cm-screen>.cm-paint{position:absolute;left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 24px);overflow:visible;pointer-events:none;user-select:none;shape-rendering:crispEdges}
.cm-export .cm-screen.cm-h3{height:50.4px}
.cm-export .cm-screen.cm-h3>.cm-paint{height:50.4px}
.cm-export .s0{color:#4b5060;}
