.cm-export .cm-controls button{font:inherit;min-width:64px;padding:3px 10px;border-radius:6px;border:1px solid var(--cm-chrome-fg);background:transparent;color:inherit;cursor:pointer}

.cm-export .cm-controls .cm-mark{position:absolute;top:2px;min-width:0;padding:1px 5px;border:0;border-left:2px solid var(--cm-chrome-fg);border-radius:0;font-size:11px;line-height:1.2;white-space:nowrap}
.cm-export .cm-controls .cm-mark.cm-mark--end{transform:translateX(-100%);border-left:0;border-right:2px solid var(--cm-chrome-fg)}
.cm-export .cm-controls select{font:inherit;background:transparent;color:inherit;border:1px solid var(--cm-chrome-fg);border-radius:6px}
.cm-export .cm-controls option{color:#000}
.cm-export .cm-time{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
.cm-export .cm-error{padding:12px;font:13px system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--cm-chrome-fg)}
.cm-export .cm-controls{flex-wrap:wrap}
.cm-export .cm-controls .cm-chapters{max-width:160px}
.cm-player-host>.cm-window,.cm-player-host>.cm-player{max-width:100%}
.cm-export.cm-player-host>.cm-window>.cm-screen,.cm-export.cm-player-host>.cm-player>.cm-screen{box-sizing:border-box;max-width:100%;overflow-x:auto}
.cm-export .cm-controls .cm-mark{width:8px;height:8px;overflow:hidden;color:transparent;padding:0;border-left-color:var(--cm-chrome-fg);border-right-color:var(--cm-chrome-fg)}

        });
        function onKeyDown(e) {
            if (e.target === seek || e.target === rate || e.target === play || (e.target.closest && e.target.closest('button,input,select'))) {
                return;
            }
            if (e.key === ' ' || e.key === 'k') {
                e.preventDefault();
                play.click();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                self.seek(t + (e.key === 'ArrowLeft' ? -5000 : 5000));
            } else if (e.key === 'Home' || e.key === 'End') {
                e.preventDefault();
                self.seek(e.key === 'Home' ? 0 : total);
            }
        }
        host.addEventListener('keydown', onKeyDown);

        // A deep link (data-cm-start) opens at its moment without autoplay; options.start opens there and keeps it, so a host
        // that starts at a poster's moment draws that frame once instead of the first frame and then a seek.
        var start = parseFloat(host.getAttribute('data-cm-start') || '');
        if (!isNaN(start)) {
            t = Math.max(0, Math.min(total, start));
            autoplayed = true;
        } else if (options && isFinite(+options.start) && +options.start > 0) {
            t = Math.max(0, Math.min(total, +options.start));
        }
        draw();
        labels(performance.now());
        players.push(self);
        if (observer) {
            observer.observe(host);
        } else {
            self.setVisible(true);
        }
    }

    function fail(host, message) {
        host.classList.add('cm-export');
        var box = el('div', 'cm-error', host);
        box.textContent = 'This recording could not be loaded: ' + message;
    }

    function mount(host, data, options) {
        if (!host || host.__cmPlayer) {
            return host ? host.__cmPlayer : null;
        }
        if (!data || data.format !== 'consolemonster-player') {
            fail(host, 'not ConsoleMonster player data');
            return null;
        }
        return new Player(host, data, options);
    }

    function load(host) {
        if (host.__cmPlayer || host.__cmLoading) {
            return;
        }
        var loading = {};
        host.__cmLoading = loading;
        var hash = /[#&]t=(\d+)/.exec(location.hash);
        if (hash && !host.hasAttribute('data-cm-start') && document.querySelectorAll('[data-cm-recording]').length === 1) {
            host.setAttribute('data-cm-start', hash[1]);
        }
        var source = host.getAttribute('data-cm-recording') || '';
        if (source.charAt(0) === '#') {
            var element = document.getElementById(source.slice(1));
            try {
                mount(host, JSON.parse(element ? element.textContent : 'null'));
            } catch (e) {
                fail(host, e.message);
            }
            delete host.__cmLoading;
            return;
        }
        fetch(source).then(function (response) {
            if (!response.ok) {
                throw new Error(response.status + ' ' + response.statusText);
            }
            return response.json();
        }).then(function (data) {
            if (host.__cmLoading !== loading) { return; }
            delete host.__cmLoading;
            mount(host, data);
        }, function (e) {
            if (host.__cmLoading !== loading) { return; }
            delete host.__cmLoading;
            fail(host, e.message);
        });
    }

    function scan(root) {
        var hosts = (root || document).querySelectorAll('[data-cm-recording]');
        for (var i = 0; i < hosts.length; i++) {
            load(hosts[i]);
        }
    }

    document.addEventListener('visibilitychange', function () {
        for (var i = 0; i < players.length; i++) {
            players[i].visibility();
        }
    });

    if (motion && motion.addEventListener) {
        motion.addEventListener('change', function () {
            if (motion.matches) {
                for (var i = 0; i < players.length; i++) { players[i].pause(); }
            }
        });
    }

    window.ConsoleMonsterPlayer = { mount: mount, scan: scan, players: players, version: 1 };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { scan(); });
    } else {
        scan();
    }
})();

</script>
</body>
</html>
