 *   <div data-cm-recording="run.json" data-cm-autoplay></div>          (fetched)
 *   <div data-cm-recording="#run-data"></div>                           (inline, from an element with that id)
 *   <script type="application/json" id="run-data">{...}<\/script>
 *
 * The data is what Recording.ExportPlayerData writes: {format:"consolemonster-player", version:1, title, width, height,
 * fps, duration, chrome, css, rows:[html], frames:[[startMs,[rowIndex...]]]}, plus optional markers:[[startMs,label]], which
 * ExportPlayerData writes when chapters are present: marks under the position bar and a chapter list that seek to their moments. Players found when the page loads are
 * mounted automatically; ConsoleMonsterPlayer.mount(element, data[, options]) and ConsoleMonsterPlayer.scan(root) mount others.
 * options.start (milliseconds) opens the player at that moment: the first frame drawn is that one, and autoplay still
 * applies, from the beginning when the player opened at its end (data-cm-start, a deep link, opens there too but does not
 * autoplay). player.state() reports the position, the
 * duration and whether it is playing.
 *
 * Cost: a frame change rewrites only the rows that differ from the previous frame; playback wakes at the recording's
 * frame rate at most, scaled by playback speed, and the clock, the position bar and its accessible text change at most once a second (and on
 * seeking). A player pauses while off-screen or while the tab is hidden and resumes on return. Only one player per page
 * autoplays (the first that asks with data-cm-autoplay), and none does when the reader prefers reduced motion. With
 * data-cm-loop a player starts again from the beginning when it reaches the end, until it is paused; without it a player
 * stops on the last frame and nothing runs until the reader plays it again.
 */
(function () {
    'use strict';
    if (window.ConsoleMonsterPlayer) {
        return;
    }
    var players = [];
    var counter = 0;
    var autoplayOwner = null;
    var motion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var observer = typeof IntersectionObserver === 'function' ? new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
            var player = entries[i].target.__cmPlayer;
            if (player) {
                player.setVisible(entries[i].isIntersecting);
            }
        }
    }) : null;

    function fmt(ms) {
        var s = Math.floor(ms / 1000);
        var h = Math.floor(s / 3600);
        var m = Math.floor(s / 60) % 60;
        var sec = ('0' + (s % 60)).slice(-2);
        return h > 0 ? h + ':' + ('0' + m).slice(-2) + ':' + sec : m + ':' + sec;
    }

    function el(tag, className, parent) {
        var e = document.createElement(tag);
        if (className) {
            e.className = className;
        }
        if (parent) {
            parent.appendChild(e);
        }
        return e;
    }

    function Player(host, data, options) {
        var self = this;
        var frames = data.frames || [];
        var rows = data.rows || [];
        var total = Math.max(0, data.duration || (frames.length ? frames[frames.length - 1][0] : 0));
        var height = data.height || (frames.length ? frames[0][1].length : 0);
        var minDelay = 1000 / Math.max(1, Math.min(60, data.fps || 10));
        var id = ++counter;
        var t = 0, shown = -1, speed = 1, last = 0, lastLabel = -1e9, timer = 0;
        var want = false, playing = false, visible = !observer, autoplayed = false;
        var current = [];
        var lines = [];
        var destroyed = false;
        var originalChildren = Array.prototype.slice.call(host.childNodes);
        var originalWidth = host.style.getPropertyValue('width');
        var originalWidthPriority = host.style.getPropertyPriority('width');

        host.__cmPlayer = self;
        host.setAttribute('data-cm-player', String(id));
        host.classList.add('cm-export', 'cm-player-host');
        if (!host.hasAttribute('tabindex')) {
            host.tabIndex = 0;
        }
        if (data.css) {
            var style = el('style');
            style.textContent = String(data.css).split('.cm-export').join('.cm-export[data-cm-player="' + id + '"]');
            host.appendChild(style);
        }
        var frame = host;
        if (data.chrome) {
            var chromeStyle = /^(macos|windows|linux)$/.test(data.chromeStyle) ? data.chromeStyle : 'macos';
            frame = el('div', 'cm-window cm-chrome-' + chromeStyle, host);
            if (data.chromeBar) {
                frame.innerHTML = data.chromeBar;
            } else {
                // Version 1 data written before chrome styles used the MacOS title bar.
                var bar = el('div', 'cm-titlebar', frame);
                el('span', 'cm-dots', bar).innerHTML = '<i></i><i></i><i></i>';
                var title = el('span', 'cm-title', bar);
                title.textContent = data.title || '';
                title.title = data.title || '';
            }
        } else {
            frame = el('div', 'cm-player', host);
        }
        var screen = el('pre', 'cm-screen', frame);
        screen.setAttribute('role', 'img');
        screen.setAttribute('aria-label', data.title || 'Console recording');
        var scrollHint = null, sizeObserver = null;
        if (host.classList.contains('cm-standalone')) {
            scrollHint = el('p', 'cm-scroll-hint', frame);
            scrollHint.textContent = 'Scroll horizontally to see the full terminal.';
            scrollHint.hidden = true;
            if (typeof ResizeObserver === 'function') {
                sizeObserver = new ResizeObserver(updateScrollHint);
                sizeObserver.observe(screen);
            }
            window.addEventListener('resize', sizeStandalone);
            if (document.fonts) {
                document.fonts.ready.then(sizeStandalone);
                document.fonts.addEventListener('loadingdone', sizeStandalone);
            }
        }
        function sizeStandalone() {
            if (!scrollHint || destroyed) { return; }
            // Measure a run in the screen's actual font, including a web font that arrives after mount.
            var probe = el('span', null, screen);
            probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;white-space:pre;width:auto;height:auto;font:inherit;letter-spacing:inherit';
            probe.textContent = '0123456789'.repeat(20);
            var cell = probe.getBoundingClientRect().width / probe.textContent.length;
            probe.remove();
            if (cell > 0) {
                var css = window.getComputedStyle(screen);
                var inset = parseFloat(css.paddingLeft) + parseFloat(css.paddingRight)
                    + parseFloat(css.borderLeftWidth) + parseFloat(css.borderRightWidth);
                host.style.width = Math.ceil(cell * data.width + inset) + 'px';
            }
            updateScrollHint();
        }
        function updateScrollHint() {
            if (scrollHint && !destroyed) { scrollHint.hidden = screen.scrollWidth <= screen.clientWidth + 1; }
        }
        for (var r = 0; r < height; r++) {
            if (r > 0) {
                screen.appendChild(document.createTextNode('\n'));
            }
            lines.push(el('span', 'cm-line', screen));
            current.push(-1);
        }
        var controls = el('div', 'cm-controls cm-controls-v2', frame);
        var transport = el('div', 'cm-transport', controls);
        var play = el('button', 'cm-play cm-tool', transport);
        play.type = 'button';
        playLabel(false);
        var track = el('span', 'cm-track', transport);
        var seek = el('input', 'cm-seek', track);
        seek.type = 'range';
        seek.min = '0';
        seek.max = String(total);
        seek.step = '10';
        seek.value = '0';
        seek.setAttribute('aria-label', 'Position');
        // Chapter ticks overlay the range track; names appear on hover and keyboard focus.
        var marks = data.markers && data.markers.length ? el('span', 'cm-marks', track) : null;
        if (marks) {
            controls.classList.add('cm-has-marks');
            data.markers.forEach(function (marker) {
                var at = Math.max(0, Math.min(total, +marker[0] || 0));
                var share = total > 0 ? at / total : 0;
                var mark = el('button', 'cm-mark', marks);
                mark.type = 'button';
                mark.setAttribute('data-tooltip', String(marker[1] || 'Chapter'));
                mark.setAttribute('aria-label', 'Go to ' + (marker[1] || 'Chapter'));
                mark.style.left = (share * 100).toFixed(2) + '%';
                // End tooltips hang inward so they stay inside a narrow player.
                if (share > 0.85) {
                    mark.className += ' cm-mark--end';
                }
                mark.addEventListener('click', function () { self.seek(at); });
            });
        }
        var tools = el('div', 'cm-tools', controls);
        var time = el('span', 'cm-time', tools);
        var rate = el('select', 'cm-speed', tools);
        rate.title = 'Playback speed';
        rate.setAttribute('aria-label', 'Speed');
        [0.5, 1, 2, 4].forEach(function (value) {
            var option = el('option', null, rate);
            option.value = String(value);
            option.textContent = value + '×';
            option.selected = value === 1;
        });
        if (data.markers && data.markers.length) {
            var chapterTool = el('span', 'cm-chapter-tool cm-tool', tools);
            chapterTool.setAttribute('data-tooltip', 'Chapters');
            var chapterIcon = el('span', 'cm-chapter-icon', chapterTool);
            chapterIcon.textContent = '\u2637';
            chapterIcon.setAttribute('aria-hidden', 'true');
            var chapters = el('select', 'cm-chapters', chapterTool);
            chapters.setAttribute('aria-label', 'Chapters');
            var heading = el('option', null, chapters);
            heading.textContent = 'Chapters';
            heading.value = '';
            data.markers.forEach(function (marker) {
                var chapter = el('option', null, chapters);
                chapter.textContent = String(marker[1] || 'Chapter');
                chapter.value = String(Math.max(0, Math.min(total, +marker[0] || 0)));
            });
            chapters.addEventListener('change', function () {
                if (chapters.value !== '') { self.seek(+chapters.value); }
            });
        }
        var copy = el('button', 'cm-copy cm-tool', tools);
        copy.type = 'button';
        var copyTimer = 0;
        copyLabel('Copy');
        copy.addEventListener('click', function () {
            var text = screen.textContent || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { copied('Copied'); }, selectText);
            } else { selectText(); }
        });
        function copyLabel(label) {
            copy.innerHTML = '<span aria-hidden="true">\u2398</span><span class="cm-tool-label"></span>';
            copy.lastChild.textContent = label;
            copy.setAttribute('aria-label', label);
            copy.setAttribute('data-tooltip', label);
        }
        function copied(label) {
            if (destroyed) { return; }
            window.clearTimeout(copyTimer);
            copyLabel(label);
            copy.classList.add('cm-feedback');
            copyTimer = window.setTimeout(function () {
                copyLabel('Copy'); copy.classList.remove('cm-feedback'); copyTimer = 0;
            }, 1600);
        }
        function selectText() {
            var range = document.createRange();
            range.selectNodeContents(screen);
            var selection = window.getSelection();
            if (selection) { selection.removeAllRanges(); selection.addRange(range); }
            copied('Text selected');
        }
        function playLabel(paused) {
            play.textContent = paused ? '\u2161' : '\u25b6';
            play.setAttribute('aria-label', paused ? 'Pause' : 'Play');
            play.setAttribute('data-tooltip', paused ? 'Pause' : 'Play');
        }
        var help = el('details', 'cm-help', tools);
        var helpToggle = el('summary', 'cm-tool', help);
        helpToggle.textContent = '?';
        helpToggle.setAttribute('aria-label', 'Keyboard shortcuts');
        helpToggle.setAttribute('data-tooltip', 'Keyboard shortcuts');
        var helpBody = el('div', 'cm-help-body', help);
        helpBody.innerHTML = '<strong>Keyboard shortcuts</strong><br><kbd>Space</kbd> Play / pause<br>' +
            '<kbd>\u2190</kbd> <kbd>\u2192</kbd> Back / forward 5 seconds<br><kbd>1</kbd>\u2013<kbd>9</kbd> Jump to chapter<br>' +
            '<kbd>Home</kbd> <kbd>End</kbd> Start / finish<br><kbd>Esc</kbd> Close help';

        function at(ms) {
            var lo = 0, hi = frames.length - 1;
            while (lo < hi) {
                var mid = (lo + hi + 1) >> 1;
                if (frames[mid][0] <= ms) {
                    lo = mid;
                } else {
                    hi = mid - 1;
                }
            }
            return lo;
        }

        // Rewrites only the rows whose content differs from what is on screen.
        function draw() {
            if (!frames.length) {
                return;
            }
            var i = at(t);
            if (i === shown) {
                return;
            }
            shown = i;
            var ids = frames[i][1];
            for (var r = 0; r < lines.length; r++) {
                var row = r < ids.length ? ids[r] : -1;
                if (row !== current[r]) {
                    current[r] = row;
                    lines[r].innerHTML = row >= 0 ? rows[row] : '';
                }
            }
            updateScrollHint();
        }

        function labels(now) {
            lastLabel = now;
            var text = fmt(t) + ' / ' + fmt(total);
            time.textContent = text;
            seek.value = String(Math.round(t));
            seek.setAttribute('aria-valuetext', text);
        }

        function advance(now) {
            if (playing) {
                t = Math.min(total, t + (now - last) * speed);
                last = now;
            }
        }

        // Wakes at the next frame change (scaled by playback speed) or when the clock must move.
        function schedule(now) {
            var next = shown + 1 < frames.length ? frames[shown + 1][0] : total;
            var frameDelay = minDelay / speed;
            var delay = Math.max(frameDelay, (next - t) / speed);
            delay = Math.min(delay, Math.max(frameDelay, 1000 - (now - lastLabel)));
            timer = window.setTimeout(step, delay);
        }

        function step() {
            timer = 0;
            var now = performance.now();
            advance(now);
            draw();
            if (t >= total && self.loop && want) {
                // Looping: back to the first frame, still playing.
                t = 0;
                shown = -1;
                draw();
                labels(now);
                schedule(now);
                return;
            }
            if (t >= total) {
                labels(now);
                want = false;
                stopTimer();
                playing = false;
                playLabel(false);
                return;
            }
            if (now - lastLabel >= 1000) {
                labels(now);
            }
            schedule(now);
        }

        function stopTimer() {
            if (timer) {
                window.clearTimeout(timer);
                timer = 0;
            }
        }

        function resume() {
            if (!want || playing || !visible || document.hidden || !frames.length) {
                return;
            }
            playing = true;
            last = performance.now();
            playLabel(true);
            schedule(last);
        }

        function suspend() {
            if (!playing) {
                return;
            }
            var now = performance.now();
            advance(now);
            playing = false;
            stopTimer();
            labels(now);
        }

        self.play = function () {
            if (destroyed) { return; }
            if (t >= total) {
                t = 0;
                draw();
            }
            want = true;
            playLabel(true);
            resume();
        };

        self.pause = function () {
            want = false;
            suspend();
            playLabel(false);
        };

        self.seek = function (ms) {
            if (destroyed) { return; }
            var now = performance.now();
            advance(now);
            t = Math.max(0, Math.min(total, ms));
            draw();
            labels(now);
            if (playing) {
                stopTimer();
                last = now;
                schedule(now);
            }
        };

        self.setVisible = function (value) {
            if (destroyed) { return; }
            visible = value;
            if (!visible) {
                suspend();
                return;
            }
            if (!autoplayed && self.autoplay && !(motion && motion.matches) && (autoplayOwner === null || autoplayOwner === self)) {
                autoplayOwner = self;
                autoplayed = true;
                want = true;
                // A player opened at its end (a host showing the final frame first) autoplays from the beginning, as Play does.
                if (t >= total) {
                    t = 0;
                    draw();
                }
            }
            resume();
        };

        self.visibility = function () {
            if (document.hidden) {
                suspend();
            } else {
                resume();
            }
        };

        self.destroy = function () {
            if (destroyed) { return; }
            destroyed = true;
            window.clearTimeout(copyTimer);
            if (sizeObserver) { sizeObserver.disconnect(); }
            window.removeEventListener('resize', sizeStandalone);
            if (document.fonts) { document.fonts.removeEventListener('loadingdone', sizeStandalone); }
            if (scrollHint) {
                if (originalWidth) { host.style.setProperty('width', originalWidth, originalWidthPriority); }
                else { host.style.removeProperty('width'); }
            }
            want = false;
            suspend();
            if (observer) {
                observer.unobserve(host);
            }
            var index = players.indexOf(self);
            if (index >= 0) {
                players.splice(index, 1);
            }
            if (autoplayOwner === self) { autoplayOwner = null; }
            if (host.__cmPlayer === self) { delete host.__cmPlayer; }
            delete host.__cmLoading;
            host.removeEventListener('keydown', onKeyDown);
            screen.remove();
            Array.prototype.slice.call(host.childNodes).forEach(function (child) {
                if (originalChildren.indexOf(child) < 0) { child.remove(); }
            });
            host.classList.remove('cm-export', 'cm-player-host');
            host.removeAttribute('data-cm-player');
        };

        self.state = function () {
            return { time: t, duration: total, playing: playing, wanted: want };
        };

        self.element = host;
        self.autoplay = host.hasAttribute('data-cm-autoplay') && host.getAttribute('data-cm-autoplay') !== 'false';
        self.loop = host.hasAttribute('data-cm-loop') && host.getAttribute('data-cm-loop') !== 'false';

        play.addEventListener('click', function () {
            if (want) {
                self.pause();
            } else {
                self.play();
            }
        });
        seek.addEventListener('input', function () {
            self.seek(parseFloat(seek.value) || 0);
        });
        rate.addEventListener('change', function () {
            var now = performance.now();
            advance(now);
            speed = parseFloat(rate.value) || 1;
            if (playing) {
                stopTimer();
                schedule(now);
            }
        });
        function onKeyDown(e) {
            if (e.key === 'Escape') { help.open = false; return; }
            if (e.target === seek || e.target === rate || e.target === play || (e.target.closest && e.target.closest('button,input,select,summary'))) {
                return;
            }
            if (e.key === ' ' || e.key === 'k') {
                e.preventDefault();
                play.click();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                self.seek(t + (e.key === 'ArrowLeft' ? -5000 : 5000));
            } else if (/^[1-9]$/.test(e.key) && data.markers && data.markers[+e.key - 1]) {
                e.preventDefault();
                self.seek(+data.markers[+e.key - 1][0]);
            } else if (e.key === 'Home' || e.key === 'End') {
                e.preventDefault();
                self.seek(e.key === 'Home' ? 0 : total);
            }
        }
        host.addEventListener('keydown', onKeyDown);

        // A deep link (data-cm-start) opens at its moment without autoplay; options.start opens there and keeps it, so a host
        // that starts at a poster's moment draws that frame once instead of the first frame and then a seek.
        var start = parseFloat(host.getAttribute('data-cm-start') || '');
        if (!isNaN(start)) {
            t = Math.max(0, Math.min(total, start));
            autoplayed = true;
        } else if (options && isFinite(+options.start) && +options.start > 0) {
            t = Math.max(0, Math.min(total, +options.start));
        }
        draw();
        sizeStandalone();
        updateScrollHint();
        labels(performance.now());
        players.push(self);
        if (observer) {
            observer.observe(host);
        } else {
            self.setVisible(true);
        }
    }

    function fail(host, message) {
        host.classList.add('cm-export');
        var box = el('div', 'cm-error', host);
        box.textContent = 'This recording could not be loaded: ' + message;
    }

    function mount(host, data, options) {
        if (!host || host.__cmPlayer) {
            return host ? host.__cmPlayer : null;
        }
        if (!data || data.format !== 'consolemonster-player') {
            fail(host, 'not ConsoleMonster player data');
            return null;
        }
        return new Player(host, data, options);
    }

    function load(host) {
        if (host.__cmPlayer || host.__cmLoading) {
            return;
        }
        var loading = {};
        host.__cmLoading = loading;
        var hash = /[#&]t=(\d+)/.exec(location.hash);
        if (hash && !host.hasAttribute('data-cm-start') && document.querySelectorAll('[data-cm-recording]').length === 1) {
            host.setAttribute('data-cm-start', hash[1]);
        }
        var source = host.getAttribute('data-cm-recording') || '';
        if (source.charAt(0) === '#') {
            var element = document.getElementById(source.slice(1));
            try {
                mount(host, JSON.parse(element ? element.textContent : 'null'));
            } catch (e) {
                fail(host, e.message);
            }
            delete host.__cmLoading;
            return;
        }
        fetch(source).then(function (response) {
            if (!response.ok) {
                throw new Error(response.status + ' ' + response.statusText);
            }
            return response.json();
        }).then(function (data) {
            if (host.__cmLoading !== loading) { return; }
            delete host.__cmLoading;
            mount(host, data);
        }, function (e) {
            if (host.__cmLoading !== loading) { return; }
            delete host.__cmLoading;
            fail(host, e.message);
        });
    }

    function scan(root) {
        var hosts = (root || document).querySelectorAll('[data-cm-recording]');
        for (var i = 0; i < hosts.length; i++) {
            load(hosts[i]);
        }
    }

    document.addEventListener('visibilitychange', function () {
        for (var i = 0; i < players.length; i++) {
            players[i].visibility();
        }
    });

    if (motion && motion.addEventListener) {
        motion.addEventListener('change', function () {
            if (motion.matches) {
                for (var i = 0; i < players.length; i++) { players[i].pause(); }
            }
        });
    }

    window.ConsoleMonsterPlayer = { mount: mount, scan: scan, players: players, version: 1 };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { scan(); });
    } else {
        scan();
    }
})();

</script>
</body>
</html>
